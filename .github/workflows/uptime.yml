name: Uptime check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check website
        id: site
        continue-on-error: true
        run: |
          out=$(curl -sS --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors -w '\n%{http_code}' https://testnowcancellationsandswaps.co.uk/) || { echo "curl failed"; exit 1; }
          code=$(printf '%s' "$out" | tail -n1)
          if [ "$code" != "200" ]; then
            echo "Homepage returned HTTP $code"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'id="swap-form"'; then
            echo "Marker string missing from homepage response"
            exit 1
          fi
          echo "Website OK"

      - name: Check Apps Script backend
        id: backend
        continue-on-error: true
        run: |
          base="https://script.google.com/macros/s/AKfycbxpAa2f8VaJvKwQspRz0QEsp9KZIB_7ZIkMwskYPl2zjLgtsqoi8l_PqpvrtpQ7c2JO/exec"
          # The matcher must have run recently (stats adds matcherOk fresh on every call).
          stats=$(curl -sS -L --max-time 60 --retry 2 --retry-delay 15 --retry-all-errors "$base?action=stats") || { echo "curl failed (stats)"; exit 1; }
          if ! printf '%s' "$stats" | grep -q '"matcherOk":true'; then
            echo "Stats response has no matcherOk true. First 300 chars:"
            printf '%.300s\n' "$stats"
            exit 1
          fi
          # The board must answer with a listings array.
          board=$(curl -sS -L --max-time 60 --retry 2 --retry-delay 15 --retry-all-errors "$base?action=board") || { echo "curl failed (board)"; exit 1; }
          if ! printf '%s' "$board" | grep -q '"listings":\['; then
            echo "Board response has no listings array. First 300 chars:"
            printf '%.300s\n' "$board"
            exit 1
          fi
          echo "Backend OK"

      - name: Open issue on failure
        if: steps.site.outcome == 'failure' || steps.backend.outcome == 'failure'
        run: |
          failed=""
          if [ "${{ steps.site.outcome }}" = "failure" ]; then failed="website"; fi
          if [ "${{ steps.backend.outcome }}" = "failure" ]; then failed="${failed:+$failed + }backend (Apps Script)"; fi
          gh label create site-down --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Automated uptime alert" 2>/dev/null || true
          open_count=$(gh issue list --repo "$GITHUB_REPOSITORY" --label site-down --state open --json number --jq 'length')
          if [ "$open_count" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🔴 Site check failed" \
              --label site-down \
              --body "Failed check(s): $failed. Time: $(date -u '+%Y-%m-%d %H:%M UTC'). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            echo "An open site-down issue already exists; not creating another."
          fi
          exit 1

      - name: Close recovered issue
        if: steps.site.outcome == 'success' && steps.backend.outcome == 'success'
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label site-down --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "recovered"
          else
            echo "No open site-down issue; nothing to close."
          fi
