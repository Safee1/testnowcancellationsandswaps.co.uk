<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respond to a swap request — TestNow</title>
<meta name="theme-color" content="#0A6B36">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0A6B36; --ink-soft:#037434; --paper:#F5F0E6; --paper-warm:#EBE3D2;
    --accent:#C3135F; --muted:#58685F;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:'Inter Tight',sans-serif; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; min-height:100%; -webkit-font-smoothing:antialiased; }

  header.bar { background:var(--ink); color:var(--paper); padding:14px 18px; display:flex; align-items:center; gap:11px; flex-shrink:0; }
  header.bar img { height:32px; width:auto; border-radius:8px; background:var(--paper); padding:3px; display:block; }
  header.bar .title { font-family:'Fraunces',serif; font-size:16px; }

  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { background:#fff; border:1.5px solid rgba(10,107,54,.2); border-radius:18px; padding:28px 24px; max-width:420px; width:100%; text-align:center; }
  .card h1 { font-family:'Fraunces',serif; font-size:21px; margin-bottom:10px; line-height:1.25; }
  .card p { font-size:14.5px; line-height:1.55; color:var(--muted); margin-bottom:8px; }
  .card p.detail { color:var(--ink); font-weight:600; background:var(--paper-warm); border-radius:10px; padding:10px 12px; margin:14px 0; }

  .btn { display:inline-block; width:100%; border:none; border-radius:12px; padding:14px 18px; font-family:inherit; font-weight:600; font-size:15.5px; cursor:pointer; margin-top:6px; text-decoration:none; }
  .btn-accept { background:var(--ink); color:var(--paper); }
  .btn-decline { background:var(--paper-warm); color:var(--accent); border:1.5px solid var(--accent); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-cancel { background:none; color:var(--muted); font-size:13.5px; margin-top:12px; padding:6px; }

  .state-icon { font-size:34px; margin-bottom:6px; }
  .footnote { font-size:12px; color:var(--muted); margin-top:18px; line-height:1.5; }
  .footnote a { color:var(--ink-soft); }
</style>
</head>
<body>

<header class="bar">
  <img src="logo.jpg" alt="TestNow" onerror="this.style.display='none'">
  <div class="title">TestNow Cancellations &amp; Swaps</div>
</header>

<main>
  <div class="card" id="card">
    <p>Checking your request…</p>
  </div>
</main>

<script>
  const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbxpAa2f8VaJvKwQspRz0QEsp9KZIB_7ZIkMwskYPl2zjLgtsqoi8l_PqpvrtpQ7c2JO/exec";
  const qs = new URLSearchParams(location.search);
  const ID = qs.get('id') || '';
  const TK = qs.get('tk') || '';
  const DECISION = (qs.get('decision') === 'decline') ? 'decline' : 'accept';
  const card = document.getElementById('card');

  function render(html) { card.innerHTML = html; }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderInvalid() {
    render(
      '<div class="state-icon">⚠️</div>' +
      '<h1>This link isn\'t valid</h1>' +
      '<p>It may have already been used, or the request has expired.</p>' +
      '<a class="btn btn-decline" href="index.html">Back to TestNow</a>'
    );
  }

  function renderError(msg) {
    render(
      '<div class="state-icon">⚠️</div>' +
      '<h1>Something went wrong</h1>' +
      '<p>' + esc(msg || 'Please try again in a moment.') + '</p>' +
      '<a class="btn btn-decline" href="index.html">Back to TestNow</a>'
    );
  }

  function renderAlreadyDecided(status) {
    var text = status === 'accepted'
      ? 'You already accepted this request — check your email for the private chat link.'
      : status === 'declined'
        ? 'You already declined this request. Nothing more to do here.'
        : 'This request is no longer open.';
    render(
      '<div class="state-icon">✅</div>' +
      '<h1>Already handled</h1>' +
      '<p>' + text + '</p>' +
      '<a class="btn btn-decline" href="index.html">Back to TestNow</a>'
    );
  }

  function renderConfirm(centre) {
    var isAccept = DECISION === 'accept';
    render(
      '<h1>' + (isAccept ? 'Accept this swap request?' : 'Decline this swap request?') + '</h1>' +
      (centre ? '<p class="detail">' + esc(centre) + '</p>' : '') +
      '<p>' + (isAccept
        ? 'Nothing has happened yet — you\'re just confirming. If you accept, we\'ll open a private chat between you both and share the next steps. Your contact details stay private until then, exactly as always.'
        : 'Nothing has happened yet — you\'re just confirming. Declining costs you nothing: your listing stays up and we\'ll keep matching you automatically in the background too.') +
      '</p>' +
      '<button class="btn ' + (isAccept ? 'btn-accept' : 'btn-decline') + '" id="confirmBtn">' +
        (isAccept ? 'Yes, accept this swap' : 'Yes, decline this request') +
      '</button>' +
      '<a class="btn-cancel" href="index.html">Cancel, do nothing</a>'
    );
    document.getElementById('confirmBtn').addEventListener('click', submitDecision);
  }

  function renderFinal(status) {
    if (status === 'accepted') {
      render(
        '<div class="state-icon">🎉</div>' +
        '<h1>Swap accepted!</h1>' +
        '<p>We\'ve emailed and texted you both a private chat link to sort out the details. Check your inbox.</p>'
      );
    } else if (status === 'declined') {
      render(
        '<div class="state-icon">👍</div>' +
        '<h1>Request declined</h1>' +
        '<p>No hard feelings — your listing stays up and we\'ll keep matching you automatically in the background too.</p>'
      );
    } else {
      renderError('That request just expired — someone else may already have matched with this listing.');
    }
  }

  // No mode:'no-cors' — the endpoint returns CORS headers, so enquiryDecide's
  // own JSON result is read directly.
  function submitDecision() {
    var btn = document.getElementById('confirmBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Please wait…'; }
    fetch(SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'enquiryDecide', enquiryId: ID, token: TK, decision: DECISION })
    })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.result !== 'success') return renderError(json.message || 'Something went wrong.');
        if (json.already) return renderFinal(json.status);
        renderFinal(json.status);
      })
      .catch(function () { renderError('Could not reach TestNow — check your connection and try again.'); });
  }

  if (!ID || !TK) {
    renderInvalid();
  } else {
    fetch(SHEET_ENDPOINT + '?action=enquiryInfo&id=' + encodeURIComponent(ID) + '&tk=' + encodeURIComponent(TK))
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.result !== 'success' || !json.valid) return renderInvalid();
        if (json.status !== 'pending') return renderAlreadyDecided(json.status);
        renderConfirm(json.centre);
      })
      .catch(function () { renderError('Could not reach TestNow — check your connection and try again.'); });
  }
</script>

</body>
</html>
